name: Contrats Cucumber

# Déclenchement manuel seulement (onglet Actions) ; ne s'exécute pas à chaque push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Compiler et exécuter les contrats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Exécuter les contrats (./gradlew test)
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
        timeout-minutes: 10

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-contrats
          path: |
            build/reports/tests/test
            build/reports/cucumber
          retention-days: 14
